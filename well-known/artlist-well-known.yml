description: >-
  Well-known discovery surface across every Artlist host. developer.artlist.io publishes an
  RFC 9727 API catalog linkset that points at both OpenAPI documents — the only well-known
  document Artlist serves. The marketing/help hosts (artlist.io, www.artlist.io,
  help.artlist.io) sit behind an edge WAF that answers 403 to non-browser clients, so their
  results are recorded as "blocked", not as verified absences.
