aid: artlist
name: Artlist
description: 'Artlist is a creative-assets platform for video creators, marketers and
  brands, licensing royalty-free music, sound effects, stock footage, video templates,
  LUTs and editing plugins alongside a generative AI toolkit. The Artlist Enterprise
  API, published at developer.artlist.io, opens the company''s music catalog to partner
  platforms: a Search API for songs, artists and albums with mood/genre/instrument
  category filters plus BPM, duration, vocal-type and free-text facets, and a Download
  API that mints signed MP3/WAV asset URLs for licensed assets. Access is OAuth 2.0
  client-credentials against an Amazon Cognito authorization server with credentials
  issued by an account manager, and the developer portal publishes OpenAPI 3.1 definitions,
  an llms.txt index, an RFC 9727 /.well-known/api-catalog linkset and a hosted MCP
  server for documentation search.'
