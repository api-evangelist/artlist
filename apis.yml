apis:
- aid: artlist:search
  name: Artlist Enterprise Search API
  description: Search and retrieve the Artlist music catalog — songs (with mood, genre,
    instrument and video-theme category filters, BPM, duration, vocal type and free-text
    query), artists and albums. Returns AAC stream URLs, waveform URLs, artwork and
    the full genre-category taxonomy per song. Paged at 20 results per request.
  humanURL: https://developer.artlist.io/search/song/song-controller-get-songs
  baseURL: https://business.artlist.io/search/v1
  tags:
  - Music
  - Search
  - Catalog
  - Metadata
  properties:
  - type: OpenAPI
    url: openapi/artlist-search-openapi-original.yml
  - type: Overlay
    url: overlays/artlist-search-overlay.yaml
  - type: Documentation
    url: https://developer.artlist.io/search/song/song-controller-get-songs
- aid: artlist:download
  name: Artlist Enterprise Download API
  description: Mint a downloadable URL for a licensed Artlist asset. Takes the asset
    type (currently song), the asset id (numeric or UUID) and the desired format (mp3
    or wave), and returns the URL of the downloadable asset.
  humanURL: https://developer.artlist.io/download/downloadable/downloadable-controller-get-downloadable-url
  baseURL: https://business.artlist.io/download/v1
  tags:
  - Music
  - Download
  - Licensing
  properties:
  - type: OpenAPI
    url: openapi/artlist-download-openapi-original.yml
  - type: Overlay
    url: overlays/artlist-download-overlay.yaml
  - type: Documentation
    url: https://developer.artlist.io/download/downloadable/downloadable-controller-get-downloadable-url
- aid: artlist:docs-mcp
  name: Artlist Developer Docs MCP Server
  description: Hosted Model Context Protocol server for the Artlist Enterprise API
    documentation. Exposes a single anonymous read-only tool, searchDocs, that searches
    developer.artlist.io and returns documentation passages with source URLs. Intended
    for AI clients such as Claude Code and Cursor.
  humanURL: https://developer.artlist.io/welcome
  baseURL: https://developer.artlist.io/_mcp/server
  tags:
  - MCP
  - Documentation
  - AI
  properties:
  - type: MCPServer
    url: mcp/artlist-mcp.yml
  - type: ToolCrosswalk
    url: mcp/artlist-tool-crosswalk.yml
